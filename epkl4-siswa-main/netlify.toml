# Konfigurasi deploy Netlify untuk e-PKL (frontend Nuxt 3 SPA)
#
# ARSITEKTUR SATU-URL (tanpa Cloudflare Worker, tanpa CORS):
#   UI  : https://epkl-orzu.netlify.app            (file statis hasil build)
#   API : https://epkl-orzu.netlify.app/api/*      (proxy server-side)
#         -> diteruskan ke tunnel ngrok -> PocketBase :8090 di PC
#
# Build TIDAK butuh env var apa pun: build produksi memakai URL RELATIF
# (same-origin) — lihat composables/pocketBaseClient.js
# (urlDasarPocketBase, cabang [PRODUKSI SAME-ORIGIN]). Proxy /api/* di
# bawahlah yang menghubungkan same-origin itu ke PocketBase di PC.
#
# CATATAN: Netlify hanya menjalankan FRONTEND (statis). PocketBase
# (backend) tidak bisa berjalan di Netlify — tetap jalankan di PC dengan
# tunnel ngrok (lihat README bagian Deploy Online).
# ============================================================

[build]
  command = "npm run generate"
  publish = ".output/public"

# [PROXY API] /api/* diteruskan SERVER-SIDE ke tunnel ngrok di PC.
# Karena dilakukan server Netlify (bukan browser), interstitial ngrok
# tidak pernah tersentuh browser — fetch, <img>, dan EventSource
# (realtime SSE) semuanya aman lewat satu origin yang sama.
# URUTAN PENTING: aturan ini harus SEBELUM fallback SPA /* di bawah.
[[redirects]]
  from = "/api/*"
  to = "https://nervous-ferret-squander.ngrok-free.dev/api/:splat"
  status = 200
  force = true

# SPA fallback: semua route yang tidak punya file HTML dilayani 200.html
# (aplikasi memakai mode SPA ssr:false — navigasi ditangani Vue Router)
[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200

# Cache aset build yang di-hash secara agresif
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
